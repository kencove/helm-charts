apiVersion: v2
name: grist-core
description: A Helm chart for Grist with Postgres, Redis, and Minio
version: "0.1.0"
appVersion: "v1.3.3"
kubeVersion: ">=1.19.0-0"
maintainers:
  - name: Don Kendall
    email: kendall@donkendall.com
annotations:
  artifacthub.io/alpha: "true"

dependencies:
  - name: postgresql
    version: 16.4.5
    repository: "https://charts.bitnami.com/bitnami"
  - name: redis
    version: 20.6.3
    repository: "https://charts.bitnami.com/bitnami"
  - name: minio
    version: 15.0.0
    repository: "https://charts.bitnami.com/bitnami"
    